<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ivoryPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfaf4"/>
      <stop offset="0.48" stop-color="#f5f0e7"/>
      <stop offset="1" stop-color="#fbf8f0"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="68%">
      <stop offset="0" stop-color="#fffdf8" stop-opacity="0.82"/>
      <stop offset="0.72" stop-color="#f8f4eb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ddd3c2" stop-opacity="0.18"/>
    </radialGradient>

    <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aa8c55"/>
      <stop offset="0.45" stop-color="#d7c28e"/>
      <stop offset="0.72" stop-color="#947543"/>
      <stop offset="1" stop-color="#cfb477"/>
    </linearGradient>

    <linearGradient id="sageLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aab590"/>
      <stop offset="0.62" stop-color="#748563"/>
      <stop offset="1" stop-color="#526447"/>
    </linearGradient>

    <linearGradient id="rosePetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efd0cd"/>
      <stop offset="0.58" stop-color="#c98f95"/>
      <stop offset="1" stop-color="#9f6572"/>
    </linearGradient>

    <filter id="paperGrain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="4" seed="23" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faintGrain">
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faintGrain" mode="multiply"/>
    </filter>

    <filter id="botanicalShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="2" dy="4" result="offset"/>
      <feColorMatrix in="offset" values="0 0 0 0 0.18 0 0 0 0 0.24 0 0 0 0 0.16 0 0 0 .24 0" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softBloom" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <pattern id="tinyDots" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="13" r="1.4" fill="#a98e61" opacity="0.18"/>
      <circle cx="51" cy="47" r="1" fill="#718064" opacity="0.13"/>
    </pattern>

    <g id="leaf">
      <path d="M0 0C18-35 54-48 82-25 71 9 38 24 0 0Z" fill="url(#sageLeaf)"/>
      <path d="M5-1C30-10 51-18 74-26" fill="none" stroke="#e2e7d8" stroke-width="2.2" opacity="0.62"/>
    </g>

    <g id="roundLeaf">
      <ellipse cx="25" cy="0" rx="27" ry="18" transform="rotate(-12 25 0)" fill="#91a184"/>
      <path d="M0 5 47-5" stroke="#e7eadf" stroke-width="2" opacity="0.55"/>
    </g>

    <g id="rose" filter="url(#softBloom)">
      <path d="M0-6C-50-48-93-5-66 39-97 65-66 115-18 91 3 130 60 111 62 67 111 53 101-5 59-17 43-60 3-56 0-6Z" fill="url(#rosePetal)" opacity="0.9"/>
      <path d="M-5-1C-35-34-66-4-48 27-65 55-36 78-8 61 10 87 45 69 41 39 69 22 53-13 27-15 15-35-5-25-5-1Z" fill="#d9a3a6"/>
      <path d="M-2 4C-20-14-37 6-25 22-34 39-13 49 1 35 16 50 34 32 24 17 34 2 12-10-2 4Z" fill="#a96976"/>
      <circle cx="0" cy="14" r="8" fill="#855361" opacity="0.7"/>
    </g>

    <g id="smallFlower">
      <ellipse cx="0" cy="-18" rx="13" ry="22" fill="#e7c0be"/>
      <ellipse cx="18" cy="0" rx="22" ry="13" fill="#d8a7aa"/>
      <ellipse cx="0" cy="18" rx="13" ry="22" fill="#c98e97"/>
      <ellipse cx="-18" cy="0" rx="22" ry="13" fill="#ebcdca"/>
      <circle r="7" fill="#a87958"/>
    </g>

    <g id="berryStem">
      <path d="M0 90C12 56 12 25 1 0M5 66l31-24M9 43l-26-19M6 22l22-18" fill="none" stroke="#69795c" stroke-width="4" stroke-linecap="round"/>
      <g fill="#b77783">
        <circle cx="37" cy="41" r="8"/><circle cx="-18" cy="23" r="7"/><circle cx="29" cy="3" r="7"/><circle cx="3" cy="0" r="6"/>
      </g>
    </g>

    <g id="bouquet" filter="url(#botanicalShadow)">
      <path d="M20 25C130 100 168 235 225 385M54 64C145 86 236 58 305 92M101 150C55 213 45 283 66 347M170 255C257 245 331 282 374 347" fill="none" stroke="#5f704f" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
      <g transform="translate(80 75) rotate(-32) scale(.92)"><use href="#leaf"/></g>
      <g transform="translate(155 102) rotate(18) scale(.75)"><use href="#leaf"/></g>
      <g transform="translate(235 72) rotate(-5) scale(.66)"><use href="#roundLeaf"/></g>
      <g transform="translate(295 92) rotate(20) scale(.7)"><use href="#roundLeaf"/></g>
      <g transform="translate(103 183) rotate(115) scale(.82)"><use href="#leaf"/></g>
      <g transform="translate(64 290) rotate(76) scale(.7)"><use href="#leaf"/></g>
      <g transform="translate(184 275) rotate(-18) scale(.83)"><use href="#leaf"/></g>
      <g transform="translate(270 289) rotate(2) scale(.7)"><use href="#roundLeaf"/></g>
      <g transform="translate(347 340) rotate(23) scale(.72)"><use href="#leaf"/></g>
      <g transform="translate(25 26) scale(.9)"><use href="#rose"/></g>
      <g transform="translate(145 142) scale(.66)"><use href="#rose"/></g>
      <g transform="translate(90 248) scale(.48)"><use href="#rose"/></g>
      <g transform="translate(232 239) scale(.55)"><use href="#smallFlower"/></g>
      <g transform="translate(318 302) scale(.58)"><use href="#smallFlower"/></g>
      <g transform="translate(280 70) rotate(36) scale(.8)"><use href="#berryStem"/></g>
    </g>
  </defs>

  <rect width="1080" height="1920" fill="url(#ivoryPaper)" filter="url(#paperGrain)"/>
  <rect width="1080" height="1920" fill="url(#centerGlow)"/>
  <rect width="1080" height="1920" fill="url(#tinyDots)"/>

  <!-- Restrained champagne-gold frame -->
  <g fill="none" stroke="url(#champagne)">
    <rect x="58" y="58" width="964" height="1804" rx="34" stroke-width="3.5" opacity="0.82"/>
    <rect x="78" y="78" width="924" height="1764" rx="27" stroke-width="1.5" opacity="0.48"/>
    <path d="M160 58h255M665 58h255M160 1862h255M665 1862h255" stroke-width="7" stroke-linecap="round" opacity="0.74"/>
  </g>

  <!-- Fine corner flourishes -->
  <g fill="none" stroke="url(#champagne)" stroke-width="3" opacity="0.66">
    <path d="M58 224c83-8 142-67 150-150M78 245c94-14 151-71 165-167"/>
    <path d="M1022 224c-83-8-142-67-150-150M1002 245c-94-14-151-71-165-167"/>
    <path d="M58 1696c83 8 142 67 150 150M78 1675c94 14 151 71 165 167"/>
    <path d="M1022 1696c-83 8-142 67-150 150M1002 1675c-94 14-151 71-165 167"/>
    <circle cx="208" cy="74" r="8"/><circle cx="872" cy="74" r="8"/>
    <circle cx="208" cy="1846" r="8"/><circle cx="872" cy="1846" r="8"/>
  </g>

  <!-- Very faint ceremonial arch keeps the center refined -->
  <path d="M210 1685V675C210 354 870 354 870 675v1010" fill="none" stroke="#b8aa8b" stroke-width="2.5" opacity="0.2"/>
  <path d="M235 1685V690C235 402 845 402 845 690v995" fill="none" stroke="#718064" stroke-width="1.5" opacity="0.12"/>

  <!-- Main asymmetric bouquets -->
  <g transform="translate(20 18) scale(.98)"><use href="#bouquet"/></g>
  <g transform="translate(1060 1902) rotate(180) scale(1.02)"><use href="#bouquet"/></g>

  <!-- Whisper-light balancing sprigs -->
  <g transform="translate(1015 255) rotate(128) scale(.42)" opacity="0.55"><use href="#berryStem"/></g>
  <g transform="translate(65 1665) rotate(-52) scale(.42)" opacity="0.55"><use href="#berryStem"/></g>

  <!-- Clear central wash for typography -->
  <rect x="175" y="265" width="730" height="1390" rx="260" fill="#fffdf8" opacity="0.12"/>
</svg>
