<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lacePaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfbf6"/>
      <stop offset="0.5" stop-color="#f3eee5"/>
      <stop offset="1" stop-color="#faf7f0"/>
    </linearGradient>

    <radialGradient id="laceGlow" cx="50%" cy="44%" r="72%">
      <stop offset="0" stop-color="#fffefa" stop-opacity="0.9"/>
      <stop offset="0.76" stop-color="#faf6ee" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d9cfbf" stop-opacity="0.2"/>
    </radialGradient>

    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffefb"/>
      <stop offset="0.48" stop-color="#ddd4c7"/>
      <stop offset="1" stop-color="#f8f3e9"/>
    </linearGradient>

    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="4" seed="29" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint">
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>

    <filter id="raisedThread" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feOffset in="blur" dx="2" dy="2" result="shadowOffset"/>
      <feFlood flood-color="#a89d8e" flood-opacity="0.42" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowOffset" operator="in" result="shadow"/>
      <feOffset in="blur" dx="-1.5" dy="-1.5" result="lightOffset"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.92" result="lightColor"/>
      <feComposite in="lightColor" in2="lightOffset" operator="in" result="light"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="light"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="laceMesh" width="72" height="72" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="url(#thread)" stroke-width="3" opacity="0.82">
        <path d="M0 36 36 0l36 36-36 36Z"/>
        <path d="M18 18 54 54M54 18 18 54" stroke-width="1.6"/>
        <circle cx="36" cy="36" r="12"/>
        <circle cx="36" cy="36" r="4" fill="#f7f1e7"/>
      </g>
    </pattern>

    <pattern id="horizontalScallop" width="90" height="68" patternUnits="userSpaceOnUse">
      <path d="M0 3C11 49 34 64 45 64S79 49 90 3" fill="none" stroke="url(#thread)" stroke-width="6"/>
      <path d="M9 4C20 31 34 43 45 43S70 31 81 4" fill="none" stroke="#d7cec0" stroke-width="2.5"/>
      <circle cx="45" cy="51" r="5" fill="#f4eee5" stroke="#d4cabd" stroke-width="2"/>
    </pattern>

    <pattern id="verticalScallop" width="68" height="90" patternUnits="userSpaceOnUse">
      <path d="M3 0C49 11 64 34 64 45S49 79 3 90" fill="none" stroke="url(#thread)" stroke-width="6"/>
      <path d="M4 9C31 20 43 34 43 45S31 70 4 81" fill="none" stroke="#d7cec0" stroke-width="2.5"/>
      <circle cx="51" cy="45" r="5" fill="#f4eee5" stroke="#d4cabd" stroke-width="2"/>
    </pattern>

    <pattern id="centerStitch" width="180" height="220" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#d8d0c4" stroke-width="2.2" opacity="0.16">
        <path d="M90 8c-6 36-39 44-39 75 0 25 18 41 39 53 21-12 39-28 39-53 0-31-33-39-39-75Z"/>
        <path d="M90 136c-18 14-31 29-31 48 0 15 11 27 31 35 20-8 31-20 31-35 0-19-13-34-31-48Z"/>
        <path d="M51 83C26 92 13 111 12 135M129 83c25 9 38 28 39 52"/>
      </g>
    </pattern>

    <g id="laceFlower">
      <g fill="none" stroke="url(#thread)" stroke-width="8">
        <ellipse cx="0" cy="-42" rx="22" ry="43"/>
        <ellipse cx="40" cy="-13" rx="22" ry="43" transform="rotate(72 40 -13)"/>
        <ellipse cx="25" cy="34" rx="22" ry="43" transform="rotate(144 25 34)"/>
        <ellipse cx="-25" cy="34" rx="22" ry="43" transform="rotate(216 -25 34)"/>
        <ellipse cx="-40" cy="-13" rx="22" ry="43" transform="rotate(288 -40 -13)"/>
      </g>
      <circle r="22" fill="#f2ece2" stroke="#d2c8ba" stroke-width="5"/>
      <circle r="8" fill="#b99992" opacity="0.58"/>
    </g>

    <g id="embroideredSprig">
      <path d="M0 168C15 111 12 58 0 0" fill="none" stroke="#7d8b70" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
      <path d="M8 126C50 101 60 73 52 45-2 61-9 93 8 126ZM6 88C-35 70-51 43-46 17 2 26 15 53 6 88Z" fill="#98a58a" opacity="0.58"/>
      <path d="M4 50C32 36 41 16 35-3 3 4-6 25 4 50Z" fill="#758467" opacity="0.5"/>
      <circle cx="0" cy="-5" r="11" fill="#c98f98" opacity="0.72"/>
      <circle cx="53" cy="43" r="8" fill="#d6a9aa" opacity="0.7"/>
      <circle cx="-47" cy="15" r="7" fill="#b97986" opacity="0.68"/>
    </g>

    <g id="cornerLace" filter="url(#raisedThread)">
      <path d="M0 0C87 20 147 79 175 168M0 39c55 19 91 57 111 111" fill="none" stroke="url(#thread)" stroke-width="11"/>
      <g transform="translate(42 36) scale(.72)"><use href="#laceFlower"/></g>
      <g transform="translate(122 103) scale(.46)"><use href="#laceFlower"/></g>
      <path d="M8 103c43-8 77 7 99 43M77 15c-3 42 12 78 46 106" fill="none" stroke="#d8cfc2" stroke-width="5"/>
      <circle cx="16" cy="112" r="10" fill="#f5eee4" stroke="#d6ccbe" stroke-width="4"/>
      <circle cx="84" cy="18" r="9" fill="#f5eee4" stroke="#d6ccbe" stroke-width="4"/>
    </g>
  </defs>

  <rect width="1080" height="1920" fill="url(#lacePaper)" filter="url(#grain)"/>
  <rect width="1080" height="1920" fill="url(#laceGlow)"/>

  <!-- Wide woven lace bands -->
  <g filter="url(#raisedThread)">
    <rect x="20" y="20" width="1040" height="135" rx="22" fill="url(#laceMesh)" opacity="0.76"/>
    <rect x="20" y="1765" width="1040" height="135" rx="22" fill="url(#laceMesh)" opacity="0.76"/>
    <rect x="20" y="145" width="135" height="1630" fill="url(#laceMesh)" opacity="0.76"/>
    <rect x="925" y="145" width="135" height="1630" fill="url(#laceMesh)" opacity="0.76"/>
  </g>

  <!-- Scalloped inner lace edge -->
  <g filter="url(#raisedThread)" opacity="0.9">
    <rect x="110" y="118" width="860" height="68" fill="url(#horizontalScallop)"/>
    <rect x="110" y="1734" width="860" height="68" transform="rotate(180 540 1768)" fill="url(#horizontalScallop)"/>
    <rect x="118" y="150" width="68" height="1620" fill="url(#verticalScallop)"/>
    <rect x="894" y="150" width="68" height="1620" transform="rotate(180 928 960)" fill="url(#verticalScallop)"/>
  </g>

  <!-- Fine stitched frame and quiet patterned center -->
  <rect x="180" y="180" width="720" height="1560" rx="42" fill="url(#centerStitch)"/>
  <rect x="181" y="181" width="718" height="1558" rx="42" fill="none" stroke="#c9bca9" stroke-width="2.5" stroke-dasharray="3 11" opacity="0.58"/>
  <rect x="200" y="200" width="680" height="1520" rx="34" fill="#fffdf9" opacity="0.31"/>

  <!-- Lace floral corner medallions -->
  <g transform="translate(28 30) scale(1.02)"><use href="#cornerLace"/></g>
  <g transform="translate(1052 30) rotate(90) scale(1.02)"><use href="#cornerLace"/></g>
  <g transform="translate(28 1890) rotate(-90) scale(1.02)"><use href="#cornerLace"/></g>
  <g transform="translate(1052 1890) rotate(180) scale(1.02)"><use href="#cornerLace"/></g>

  <!-- Subtle coloured embroidery, kept outside the wording area -->
  <g transform="translate(118 355) rotate(-18) scale(.72)"><use href="#embroideredSprig"/></g>
  <g transform="translate(962 1565) rotate(162) scale(.72)"><use href="#embroideredSprig"/></g>

  <!-- Small lace rosettes along the vertical frame -->
  <g opacity="0.72" filter="url(#raisedThread)">
    <g transform="translate(120 690) scale(.42)"><use href="#laceFlower"/></g>
    <g transform="translate(960 690) scale(.42)"><use href="#laceFlower"/></g>
    <g transform="translate(120 1230) scale(.42)"><use href="#laceFlower"/></g>
    <g transform="translate(960 1230) scale(.42)"><use href="#laceFlower"/></g>
  </g>
</svg>
