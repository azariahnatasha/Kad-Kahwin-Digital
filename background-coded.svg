<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ed"/>
      <stop offset="0.5" stop-color="#f1ede4"/>
      <stop offset="1" stop-color="#faf7f0"/>
    </linearGradient>

    <filter id="paperTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="softNoise">
        <feFuncA type="table" tableValues="0 0.075"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>

    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feOffset in="blur" dx="3" dy="3" result="darkOffset"/>
      <feFlood flood-color="#b9b0a1" flood-opacity="0.5" result="darkColor"/>
      <feComposite in="darkColor" in2="darkOffset" operator="in" result="dark"/>
      <feOffset in="blur" dx="-3" dy="-3" result="lightOffset"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.9" result="lightColor"/>
      <feComposite in="lightColor" in2="lightOffset" operator="in" result="light"/>
      <feMerge>
        <feMergeNode in="dark"/>
        <feMergeNode in="light"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#59634b" flood-opacity="0.22"/>
    </filter>

    <pattern id="damask" width="240" height="310" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#d6cfc3" stroke-width="3.2" opacity="0.42">
        <path d="M120 8c-8 43-47 48-47 86 0 26 20 42 47 56 27-14 47-30 47-56 0-38-39-43-47-86Z"/>
        <path d="M120 34c-2 36-27 43-27 66 0 17 12 30 27 39 15-9 27-22 27-39 0-23-25-30-27-66Z"/>
        <path d="M120 150c-18 20-35 37-35 62 0 24 17 41 35 55 18-14 35-31 35-55 0-25-17-42-35-62Z"/>
        <path d="M86 168c-28 7-52 24-58 49-5 22 8 43 31 52-5-23 5-43 27-54M154 168c28 7 52 24 58 49 5 22-8 43-31 52 5-23-5-43-27-54"/>
        <path d="M120 267c-16 10-28 22-31 39M120 267c16 10 28 22 31 39"/>
        <path d="M0 77c29 9 48 29 50 58 2 24-12 42-34 49M240 77c-29 9-48 29-50 58-2 24 12 42 34 49"/>
        <circle cx="120" cy="150" r="6"/>
      </g>
    </pattern>

    <pattern id="lace" width="56" height="56" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#d1c9bc" stroke-width="3" opacity="0.58">
        <path d="M0 28 28 0l28 28-28 28Z"/>
        <circle cx="28" cy="28" r="10"/>
      </g>
    </pattern>

    <g id="leafPair">
      <path d="M0 0C-23-22-42-16-48 8-27 16-10 12 0 0Z" fill="#77865d"/>
      <path d="M0 0C23-22 42-16 48 8 27 16 10 12 0 0Z" fill="#92a472"/>
      <path d="M-42 6C-25 4-11 1 0 0M42 6C25 4 11 1 0 0" fill="none" stroke="#536344" stroke-width="2"/>
    </g>

    <g id="bud">
      <path d="M0 16C-17 2-17-16 0-23 17-16 17 2 0 16Z" fill="#bc7180"/>
      <path d="M0 13C-7 2-6-10 0-18 6-10 7 2 0 13Z" fill="#dd9aa2" opacity="0.85"/>
      <path d="M0 16v15" stroke="#526141" stroke-width="3"/>
    </g>

    <g id="flower">
      <path d="M0 0C-31-9-38-34-14-46 3-34 5-17 0 0Z" fill="#c97785"/>
      <path d="M0 0C31-9 38-34 14-46-3-34-5-17 0 0Z" fill="#d8949e"/>
      <path d="M0 0C-24 15-19 39 5 43 18 24 12 8 0 0Z" fill="#b96678"/>
      <circle cx="0" cy="-2" r="6" fill="#80515c"/>
    </g>

    <g id="cornerVine" filter="url(#softShadow)">
      <path d="M25 10c52 75 32 147 93 208 54 54 115 51 160 118 43 65 26 130 83 190" fill="none" stroke="#4e6045" stroke-width="7" stroke-linecap="round"/>
      <path d="M70 94c42-34 77-51 123-46M111 211c-24 33-33 69-28 108M196 284c48-33 89-36 132-13M277 405c-34 22-51 53-55 93" fill="none" stroke="#596b4d" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(87 80) rotate(-25) scale(.82)"><use href="#leafPair"/></g>
      <g transform="translate(151 49) rotate(12) scale(.72)"><use href="#leafPair"/></g>
      <g transform="translate(92 238) rotate(68) scale(.72)"><use href="#leafPair"/></g>
      <g transform="translate(208 290) rotate(-18) scale(.88)"><use href="#leafPair"/></g>
      <g transform="translate(288 394) rotate(22) scale(.72)"><use href="#leafPair"/></g>
      <g transform="translate(231 479) rotate(79) scale(.65)"><use href="#leafPair"/></g>
      <g transform="translate(191 48) scale(.72)"><use href="#bud"/></g>
      <g transform="translate(82 320) rotate(-28) scale(.68)"><use href="#bud"/></g>
      <g transform="translate(330 272) rotate(31) scale(.7)"><use href="#bud"/></g>
      <g transform="translate(362 520) rotate(15) scale(.78)"><use href="#bud"/></g>
      <g transform="translate(116 212) scale(.72)"><use href="#flower"/></g>
      <g transform="translate(280 406) rotate(18) scale(.66)"><use href="#flower"/></g>
    </g>
  </defs>

  <rect width="1080" height="1920" fill="url(#paper)" filter="url(#paperTexture)"/>

  <!-- Embossed outer paper ornament -->
  <g filter="url(#emboss)" fill="none" stroke="#ddd6cb" opacity="0.76">
    <rect x="22" y="22" width="1036" height="1876" rx="32" stroke-width="22"/>
    <rect x="62" y="62" width="956" height="1796" rx="24" stroke-width="7"/>
    <path d="M62 205h956M62 1715h956" stroke-width="16"/>
    <path d="M175 62v1796M905 62v1796" stroke-width="12" opacity="0.55"/>

    <g stroke-width="8">
      <path d="M22 185c108-18 135-78 153-163M1058 185c-108-18-135-78-153-163M22 1735c108 18 135 78 153 163M1058 1735c-108 18-135 78-153 163"/>
      <path d="M62 330c71-29 94-83 113-150M1018 330c-71-29-94-83-113-150M62 1590c71 29 94 83 113 150M1018 1590c-71 29-94 83-113 150"/>
    </g>

    <g stroke-width="5">
      <path d="M200 62c26 48 65 71 120 72-35 33-46 71-32 115-48-18-90-8-126 31"/>
      <path d="M880 62c-26 48-65 71-120 72 35 33 46 71 32 115 48-18 90-8 126 31"/>
      <path d="M200 1858c26-48 65-71 120-72-35-33-46-71-32-115-48 18-90 8-126-31"/>
      <path d="M880 1858c-26-48-65-71-120-72 35-33 46-71 32-115 48 18 90 8 126-31"/>
      <circle cx="255" cy="126" r="28"/><circle cx="825" cy="126" r="28"/>
      <circle cx="255" cy="1794" r="28"/><circle cx="825" cy="1794" r="28"/>
    </g>
  </g>

  <!-- Main embossed invitation panel -->
  <g filter="url(#emboss)">
    <rect x="150" y="220" width="780" height="1480" rx="18" fill="#f4f0e7" fill-opacity="0.22" stroke="#d5cec2" stroke-width="9"/>
    <rect x="173" y="244" width="734" height="1432" rx="10" fill="url(#damask)" stroke="url(#lace)" stroke-width="15"/>
    <rect x="190" y="261" width="700" height="1398" rx="8" fill="none" stroke="#ebe6dc" stroke-width="5"/>
  </g>

  <!-- Quiet central veil for readable wording -->
  <rect x="205" y="285" width="670" height="1350" rx="18" fill="#f8f5ee" opacity="0.34"/>

  <!-- Hand-painted botanical corners -->
  <g transform="translate(5 15) scale(.88)">
    <use href="#cornerVine"/>
  </g>
  <g transform="translate(1075 1905) rotate(180) scale(.92)">
    <use href="#cornerVine"/>
  </g>

  <!-- Small finishing sprigs -->
  <g transform="translate(35 515) rotate(18) scale(.58)" opacity="0.9"><use href="#cornerVine"/></g>
  <g transform="translate(1045 1405) rotate(198) scale(.58)" opacity="0.9"><use href="#cornerVine"/></g>
</svg>
